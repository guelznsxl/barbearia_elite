
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | Barbearia Elite</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-body">
  <main class="login-layout">
    <section class="login-brand">
      <div class="brand-mark">BE</div>
      <p class="eyebrow">EXPERIÊNCIA • ESTILO • EXCELÊNCIA</p>
      <h1>BARBEARIA<br><span>ELITE</span></h1>
      <p class="login-intro">Gestão inteligente para uma experiência de alto padrão.</p>
      <div class="login-line"></div>
      <small>PAINEL DE ADMINISTRAÇÃO</small>
    </section>

    <section class="login-card">
      <div class="mobile-mark">BE</div>
      <p class="eyebrow">ACESSO RESTRITO</p>
      <h2>Bem-vindo de volta</h2>
      <p class="muted">Entre com suas credenciais de administrador.</p>

      <form id="formLogin" class="form-stack">
        <label>Usuário
          <input id="usuario" name="usuario" autocomplete="username" placeholder="Seu usuário" required>
        </label>

        <label>Senha
          <input id="senha" name="senha" type="password" autocomplete="current-password" placeholder="Sua senha" required>
        </label>

        <button class="btn btn-primary btn-wide" type="submit">
          Entrar no painel <span>→</span>
        </button>
      </form>

      <p id="loginMensagem" class="feedback" aria-live="polite"></p>
      <div class="login-foot">
        <span class="status-dot"></span>
        Acesso protegido para administradores
      </div>
    </section>
  </main>

  <script src="/js/script.js"></script>
</body>
</html>
