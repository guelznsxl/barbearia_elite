
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbearia Elite</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            padding: 30px;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 50px;
        }

        .logo span {
            color: #c9a044;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 15px;
        }

        p {
            color: #aaa;
            margin-bottom: 35px;
        }

        a {
            display: inline-block;
            background: #c9a044;
            color: #111;
            text-decoration: none;
            padding: 16px 40px;
            border-radius: 6px;
            font-weight: bold;
        }

        a:hover {
            background: #e0b85c;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            BARBEARIA <span>ELITE</span>
        </div>

        <h1>Bem-vindo à Barbearia Elite</h1>

        <p>Sistema de gerenciamento da barbearia.</p>

        <a href="/painel">ENTRAR NO SISTEMA</a>

    </div>

</body>
</html>
