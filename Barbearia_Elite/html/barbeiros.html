
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbeiros | Barbearia Elite</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <div class="layout">

        <aside class="sidebar" id="sidebar">
            <h2>Barbearia Elite</h2>

            <nav>
                <a href="/">Dashboard</a>
                <a href="/clientes">Clientes</a>
                <a href="/barbeiros" class="active">Barbeiros</a>
                <a href="/servicos">Serviços</a>
                <a href="/agendamentos">Agendamentos</a>
                <a href="/admin">Administração</a>
            </nav>

            <button id="btnSair">Sair</button>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <button id="menuToggle">☰</button>
                <h1>Gerenciar barbeiros</h1>
            </header>

            <section class="content">

                <div class="page-heading">
                    <h2>Cadastro de barbeiros</h2>
                    <p>Cadastre e gerencie os profissionais da barbearia.</p>
                </div>

                <div class="form-card">
                    <h3>Novo barbeiro</h3>

                    <form id="formBarbeiro">
                        <input type="hidden" id="barbeiroId">

                        <label for="barbeiroNome">Nome completo</label>
                        <input type="text" id="barbeiroNome" required>

                        <label for="barbeiroTelefone">Telefone</label>
                        <input type="text" id="barbeiroTelefone" required>

                        <label for="barbeiroEspecialidade">Especialidade</label>
                        <input type="text" id="barbeiroEspecialidade" required>

                        <button type="submit">Salvar barbeiro</button>
                    </form>

                    <p id="mensagemBarbeiro"></p>
                </div>

                <div class="table-card">
                    <h3>Barbeiros cadastrados</h3>

                    <button id="btnAtualizarBarbeiros" type="button">
                        Atualizar lista
                    </button>

                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Nome</th>
                                    <th>Telefone</th>
                                    <th>Especialidade</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>

                            <tbody id="tabelaBarbeiros">
                            </tbody>
                        </table>
                    </div>
                </div>

            </section>
        </main>

    </div>

    <script src="/js/script.js"></script>
</body>
</html>
